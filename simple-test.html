<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Simple - inFusion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
        .product-price {
            font-size: 20px;
            color: #e74c3c;
            font-weight: bold;
            margin: 10px 0;
        }
        .add-to-cart {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .add-to-cart:hover {
            background: #2980b9;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Simple - Productos inFusion</h1>
        
        <div class="products-grid" id="products-grid">
            <!-- Los productos se cargarán aquí -->
        </div>
    </div>

    <script>
        // Datos de productos simples
        const products = [
            {
                id: 1,
                name: "Gin Belladonna",
                price: 25000,
                image: "./IMG/Gin Belladonna.jpg",
                category: "gin"
            },
            {
                id: 2,
                name: "Cordero Con Piel de Lobo Malbec",
                price: 5500,
                image: "./IMG/Cordero Con Piel de Lobo Malbec.jpg",
                category: "vino"
            },
            {
                id: 3,
                name: "BEEFEATER GIN X 700 CC",
                price: 18000,
                image: "./IMG/BEEFEATER GIN X 700 CC.jpg",
                category: "gin"
            },
            {
                id: 4,
                name: "BOMBAY GIN X 750 CC",
                price: 22000,
                image: "./IMG/BOMBAY GIN X 750 CC.jpg",
                category: "gin"
            }
        ];

        function renderProducts() {
            const productsGrid = document.getElementById('products-grid');
            
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" onerror="this.src='./IMG/vino.jpg'">
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">$${product.price.toLocaleString()}</div>
                    <button class="add-to-cart" onclick="alert('Agregado: ${product.name}')">
                        Agregar al Carrito
                    </button>
                `;
                productsGrid.appendChild(card);
            });
        }

        // Renderizar cuando la página cargue
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Página cargada, renderizando productos...');
            renderProducts();
            console.log('Productos renderizados');
        });
    </script>
</body>
</html>
